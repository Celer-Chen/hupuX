name: Build

# 只有「应用本体」改动才会跑：纯文档 / README / 仓库配图改动直接不触发，
# 免得白白占 CI 额度、也不会平白升一个版本号。
#
# 注意：提交信息里出现方括号包起来的 skip-ci 指令（skip ci / ci skip 两种写法）时，
# GitHub 会跳过整条流水线——下面 release job 回写版本号的那条提交就是故意带它来防递归的，
# 但平时写提交信息时别误用，否则这次改动既不会构建也不会发版。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
      - 'UI.png'
      - 'screenshot.png'
      - 'icon.png'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
      - 'UI.png'
      - 'screenshot.png'
      - 'icon.png'

# 同一分支上的多次推送排队执行，避免两个 run 同时回写版本号打架
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 决定这次要构建/发布的版本号 ────────────────────────────────────────────
  # 只算不写：版本号通过命令行参数注入构建，全部成功后才由 release job 回写仓库。
  # 这样构建失败时仓库里不会留下一个「有版本号没 release」的提交。
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version:     ${{ steps.calc.outputs.version }}
      versionCode: ${{ steps.calc.outputs.versionCode }}
      bumped:      ${{ steps.calc.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: calc
        run: |
          set -euo pipefail
          # 从某个提交里读版本字段
          read_at() { git show "$1:gradle.properties" 2>/dev/null | grep "^$2=" | cut -d= -f2 || true; }

          PUSHED=$(read_at "$GITHUB_SHA" appVersion)
          PUSHED_CODE=$(read_at "$GITHUB_SHA" appVersionCode)

          # 非 main 推送（PR 等）不升版本，按现状构建
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "非 main 推送，沿用当前版本 $PUSHED"
            { echo "version=$PUSHED"; echo "versionCode=$PUSHED_CODE"; echo "bumped=false"; } >> $GITHUB_OUTPUT
            exit 0
          fi

          # 自动升版本以 origin/main 的最新状态为基线（而不是本次推送的提交），
          # 这样「构建期间又推了一次」时，后一个 run 能看到前一个 run 回写的版本号，不会撞号。
          git fetch origin main --quiet
          BASE=$(read_at origin/main appVersion)
          BASE_CODE=$(read_at origin/main appVersionCode)
          [ -n "$BASE" ] || BASE=$PUSHED
          [ -n "$BASE_CODE" ] || BASE_CODE=$PUSHED_CODE

          # 推送前的版本，用于判断这次推送是不是「手动改版」。
          # 比较的是推送前后的提交本身，而不是 origin/main，
          # 否则上一轮 CI 回写的版本号会被误判成手动改版。
          BEFORE="${{ github.event.before }}"
          PREV=""; PREV_CODE=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            PREV=$(read_at "$BEFORE" appVersion)
            PREV_CODE=$(read_at "$BEFORE" appVersionCode)
          fi

          # 版本号：手动改过就用手动的，否则 patch +1
          if [ -n "$PREV" ] && [ "$PREV" != "$PUSHED" ]; then
            VERSION=$PUSHED
            echo "版本号：本次推送手动指定 $PREV -> $PUSHED"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "版本号：自动 $BASE -> $VERSION"
          fi

          # versionCode 单独判断：手动改版时如果忘了同步改它，这里补上 +1，
          # 否则 Android 会用同一个 versionCode 出包，装不上（必须递增）。
          if [ -n "$PREV_CODE" ] && [ "$PREV_CODE" != "$PUSHED_CODE" ]; then
            CODE=$PUSHED_CODE
            echo "versionCode：本次推送手动指定 $PREV_CODE -> $PUSHED_CODE"
          else
            CODE=$((BASE_CODE + 1))
            echo "versionCode：自动 $BASE_CODE -> $CODE"
          fi

          # 两者只要和仓库里现有的不一致，就需要在发布前回写
          BUMPED=false
          if [ "$VERSION" != "$PUSHED" ] || [ "$CODE" != "$PUSHED_CODE" ]; then BUMPED=true; fi
          { echo "version=$VERSION"; echo "versionCode=$CODE"; echo "bumped=$BUMPED"; } >> $GITHUB_OUTPUT

  # ── Android APK ───────────────────────────────────────────────────────────────
  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint check
        run: ./gradlew :app:lintDebug

      - name: Build release APK
        run: >-
          ./gradlew :app:assembleRelease
          "-PappVersion=${{ needs.version.outputs.version }}"
          "-PappVersionCode=${{ needs.version.outputs.versionCode }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/release/*.apk
          # 传的都是已经压过的二进制，默认还会再 zip 一遍（level 6）纯属白费：
          # 上传更慢，也更容易撞上 CreateArtifact 超时。0 = 只打包不压缩。
          compression-level: 0

  # ── 回写版本号 + 发 GitHub Release（推送到 main 且构建成功时）──────────────────
  release:
    name: Publish Release
    needs: [ version, android ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      # 关键：检出 main 的最新 HEAD，而不是触发本次运行的那个提交。
      # 否则「在旧提交上改版本号 → 再 rebase 到 main」会和上一轮 CI 自己的
      # 版本号回写提交改到同一行，必然冲突。
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 构建成功了，此时才把版本号写回仓库。
      # 用 GITHUB_TOKEN 推送不会再触发 workflow（GitHub 的防递归规则），[skip ci] 是双保险。
      - name: Bump version in repo
        if: needs.version.outputs.bumped == 'true'
        run: |
          VERSION=${{ needs.version.outputs.version }}
          CODE=${{ needs.version.outputs.versionCode }}
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s/^appVersion=.*/appVersion=$VERSION/"          gradle.properties
          sed -i "s/^appVersionCode=.*/appVersionCode=$CODE/"     gradle.properties
          # 版本号可能已被并发的另一轮写成同样的值，这时无需提交，也不该失败
          if git diff --quiet; then
            echo "版本号已是 $VERSION，跳过回写"
          else
            git add gradle.properties
            git commit -m "chore: 版本号升至 $VERSION [skip ci]"
            git push origin HEAD:main
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: main
          files: |
            artifacts/android-apk/*.apk
